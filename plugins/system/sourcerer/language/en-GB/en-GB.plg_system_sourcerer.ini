SRC_ADDITIONAL_RESTRICTIONS="Additional Restrictions"
SRC_ADDITIONAL_RESTRICTIONS_DESC="These restrictions always apply, including when PHP uses the same policy as Process Tags. They are additional checks, not a sandbox for untrusted PHP."
SRC_ALLOW_CSS_TAGS="Allow CSS tags"
SRC_ALLOW_CSS_TAGS_DESC="Choose where CSS is allowed."
SRC_ALLOW_JAVASCRIPT_TAGS="Allow JavaScript tags"
SRC_ALLOW_JAVASCRIPT_TAGS_DESC="Choose where JavaScript is allowed."
SRC_ALLOW_PHP_TAGS="Allow PHP tags"
SRC_ALLOW_PHP_TAGS_DESC="Choose where PHP is allowed."
SRC_ARTICLE_SECURITY_SCOPE_DESC="Author security settings apply only to articles."
SRC_BODY_AFTER="End of HTML body"
SRC_BODY_BEFORE="Before HTML body"
SRC_CODE="Code"
SRC_CODE_DESC="You can enter your HTML, CSS, JavaScript and/or PHP code in the field below."
SRC_CODE_PLACEMENT="Placement"
SRC_CODE_PLACEMENT_DESC="Select whether to load the code in the html head or inline where you place this the Sourcerer tag."
SRC_CODE_POSITION="Position"
SRC_CODE_POSITION_DESC="Set the position in the html to place the code."
SRC_CODE_REMOVED_NOT_ALLOWED="The [[%1:code type%]] code has been removed, because [[%1:code type%]] is not allowed here."
SRC_CODE_REMOVED_NOT_ENABLED="The code has been removed, because Sourcerer is not enabled here."
SRC_CODE_REMOVED_SECURITY="The %s code has been removed because its source is not trusted for this code type."
SRC_CODE_REMOVED_UNTRUSTED="The code has been removed because Sourcerer found it only in rendered page output and could not confirm where the content was stored or who was allowed to edit it."
SRC_CODE_TYPE_ENABLE_DESC="Choose where this code type is allowed in this area."
SRC_COLOR_CODE="Color Code"
SRC_COLOR_CODE_DESC="Select to have the editor button add colors to the code when inserting it into the editor."
SRC_CSS_CODE_DESC="The CSS code will be added to the Head of the HTML document."
SRC_CSS_FILE_DESC="The CSS file will be added to the Head of the HTML document."
SRC_CSS_SECURITY_LEVEL="CSS Security Level"
SRC_DEFAULTS="Defaults"
SRC_DEFAULTS_DESC="These setting have effect on the initial settings when you open the Sourcerer Code Helper window."
SRC_ENABLE_IN_ARTICLES_DESC="Select whether to enable the use of the Sourcerer syntax in articles."
SRC_ENABLE_IN_COMPONENTS_DESC="Choose which Sourcerer tags are processed in component output."
SRC_ENABLE_IN_HEAD="Enable in Head"
SRC_ENABLE_IN_HEAD_DESC="Select to also handle the Sourcerer tags inside the document head section of the page. If unselected, any Sourcerer tags found in the head will get removed (together with any code inside them)."
SRC_ENABLE_OTHER_AREAS_DESC="Choose which Sourcerer tags are processed in modules, the document head and other non-component output."
SRC_EXAMPLE_CODE="Example Code"
SRC_EXAMPLE_CODE_DESC="Here you can place the example code you want to be placed inside the Sourcerer tags. If you leave this field empty and save it, this field will be reset to the default example code."
SRC_EXTRA_TABS_DESC="Or use the extra tabs to help you insert specific CSS, JavaScript and PHP files and code."
SRC_FILE="File"
SRC_FORBIDDEN_HTML_TAGS="Forbidden (HTML) Tags"
SRC_FORBIDDEN_HTML_TAGS_DESC="A comma separated list of HTML tags forbidden in all areas. These tags and their contents are removed."
SRC_FORBIDDEN_PHP_FUNCTIONS="Forbidden PHP functions"
SRC_FORBIDDEN_PHP_FUNCTIONS_DESC="A comma separated list of direct PHP function calls forbidden in all areas. Matching is case-insensitive, and the whole PHP block is removed when a match is found.<br><br>This is an extra safeguard, not a PHP security sandbox. Allowed PHP can access equivalent functionality indirectly."
SRC_GLOBAL_CODE_ENABLE_DESC="Select No to block this code type everywhere. Select Yes to use the area settings below. Switching off keeps your saved area settings."
SRC_HANDLE_PHP_ERRORS="Handle PHP Errors"
SRC_HANDLE_PHP_ERRORS_DESC="If enabled, Sourcerer catches recoverable PHP execution errors and places an explanatory HTML comment in the output instead of allowing the error to break the page. Disable this to let PHP errors propagate during development and debugging."
SRC_HTML_HEAD="HTML Head"
SRC_INCLUDE_PATH="Include Path"
SRC_INCLUDE_PATH_DESC="The path (relative to the root folder) to use when using the file attribute in the tag."
SRC_INLINE="Inline"
SRC_INSERT="Insert"
SRC_JAVASCRIPT_SECURITY_LEVEL="JavaScript Security Level"
SRC_JS_FILE_ASYNC="Async"
SRC_JS_FILE_ASYNC_DESC="Select to make the javascipt file run asynchronously as soon as it is available."
SRC_JS_FILE_DEFER="Defer"
SRC_JS_FILE_DEFER_DESC="Select to make the javascipt file run after the page has loaded."
SRC_JS_FILE_DESC="The JavaScript file will be added to the Head of the HTML document."
SRC_ONLY_IN_ADMINISTRATOR="Only in Administrator"
SRC_PHP_CODE_DESC="The <span class=&quot;rl-code&quot;>&amp;lt;?php ... ?&amp;gt;</span> will be added automatically, so you should not add them to your code."
SRC_PHP_CODE_REMOVED_FORBIDDEN="The PHP code has been removed, because it contains forbidden PHP functions"
SRC_PHP_ERROR="%s: %s"
SRC_PHP_ERROR_IN_BLOCK="%s in Sourcerer block on line %d: %s"
SRC_PHP_ERROR_IN_FILE="%s in %s on line %d: %s"
SRC_PHP_EXECUTION_FAILED="The PHP code could not be executed. Check the code and the system plugin ordering. %s"
SRC_PHP_FORBIDDEN="The PHP code contains forbidden PHP functions"
SRC_PHP_INCLUDE_METHOD="Include Method"
SRC_PHP_INCLUDE_METHOD_DESC="Select the way to load in the php file."
SRC_PHP_SECURITY_LEVEL="PHP Security Level"
SRC_PHP_SECURITY_LEVEL_DESC="Set the level of security. PHP tags (and the PHP code within) will be stripped from articles whose creator or last modifier is not a member of these groups. If the overall security level is set higher, it will overrule this."
SRC_RAW="Raw Code"
SRC_RAW_DESC="Not using a WYSIWYG editor? Select to prevent Sourcerer from stripping the HTML code."
SRC_REMOVE_FROM_SEARCH="Remove from search"
SRC_REMOVE_FROM_SEARCH_DESC="Select to remove the Sourcerer tags and content from the search results."
SRC_REQUEST_SECURITY_LEVEL_DESC="Select which logged-in user groups may submit Sourcerer tags through website requests, such as URLs and forms, without Sourcerer blocking untrusted code on that request. The normal area and code-type settings still determine what is processed.<br><br><strong>Warning:</strong> Only select groups whose members may submit every code type enabled for untrusted content."
SRC_SAME_AS_PROCESS_TAGS="Same as Process Tags"
SRC_SAME_AS_PROCESS_TAGS_DESC="<strong>Same as Process Tags:</strong> Use the Process Tags choice and trusted sources for this area. Code is always blocked wherever Process Tags is disabled."
SRC_SECURITY_DEFAULT_OPTION_DESC="<strong>Default</strong> follows the matching setting under Security - Default."
SRC_SECURITY_LEVEL="Security Level"
SRC_SECURITY_OPTIONS_DESC="<strong>No</strong> removes this code type from all Sourcerer tags.<br><strong>Yes</strong> allows this code type in trusted and untrusted content.<br><strong>Only Trusted</strong> allows this code type only in trusted content."
SRC_SECURITY_PHP_WARNING="<strong>Warning:</strong> Allowing PHP in untrusted content can cause visitor-submitted data to be executed as code. Only use this when every source that can generate page output is trusted."
SRC_SECURITY_SETTINGS_COMPONENTS_DESC="Choose whether Sourcerer runs in component output, which components are trusted, and which code types they may contain."
SRC_SECURITY_SETTINGS_OTHER_AREAS_DESC="Choose whether Sourcerer runs outside component output, which saved module sources are trusted, and which code types these areas may contain."
SRC_SECURITY_TAG_OPTIONS_DESC="<strong>No</strong> disables Sourcerer tags in this area.<br><strong>Yes</strong> processes tags in trusted and untrusted content.<br><strong>Only Trusted</strong> processes tags only in trusted content."
SRC_SECURITY_TRUSTED_CONTENT_DESC="<strong>Trusted content</strong> is an approved saved source. Joomla articles are trusted after their author and last editor pass the security checks. Component output and exact saved Custom HTML module blocks can be trusted through the settings on their security tabs."
SRC_SECURITY_UNTRUSTED_CONTENT_DESC="<strong>Untrusted content</strong> is page output whose origin and editing permissions Sourcerer cannot confirm. It may come from another extension or from visitor input. Allowing code in this content can be unsafe, so enable it only when you trust every source that can generate the output."
SRC_SHOW_WIZARD="Show Wizard"
SRC_SYNTAX_WORD="Sourcerer tag word"
SRC_SYNTAX_WORD_DESC="This defines the word to use as the Sourcerer syntax tag.<br><br>Default is 'source'. Which means the tags to use are: <span class=&quot;rl-code&quot;>{source}...{/source}</span>"
SRC_TAG_ATTRIBUTES="Tag Attributes"
SRC_TAG_ATTRIBUTES_DESC="Enter any attributes you want to add inside the Sourcerer tag itself."
SRC_TAG_REMOVED_FORBIDDEN="The tag (%s) has been removed, because it is forbidden."
SRC_TAG_SETTINGS="Tag Settings"
SRC_TEMP_PATH="Temporary File Folder"
SRC_TEMP_PATH_DESC="Please specify a writable folder to store temporary files.<br>Leave empty to use the Joomla global Temp Folder."
SRC_TRIM="Strip surrounding HTML tags"
SRC_TRIM_DESC="Select to make Sourcerer remove the surrounding paragraph tags (or span tags)."
SRC_TRUSTED_COMPONENT_SOURCES_DESC="These settings define which component output is trusted. They are used only when this area or a code type is set to <strong>Only Trusted</strong>. <strong>Same as Process Tags</strong> uses the Process Tags component list. When this area is set to <strong>Yes</strong>, ordinary tags run in all component output regardless of these trust lists."
SRC_TRUSTED_OTHER_SOURCES_DESC="These settings define which frontend module types are trusted. They are used only when Other Areas or a code type is set to <strong>Only Trusted</strong>. <strong>Same as Process Tags</strong> uses the Process Tags module list.<br><br>Custom HTML modules verify exact Sourcerer syntax from the saved module, so later additions to their rendered output stay untrusted. For other trusted module types, the complete rendered module output is trusted. Other document-head, plugin and template output remains untrusted."
SRC_TRUSTED_REQUEST_USER_GROUPS="Trusted Request User Groups"
SRC_UNTRUSTED_CODE_WARNING="<strong>Warning:</strong> This code type is allowed in untrusted content.<br><br>[[%1:untrusted content description%]]"
SRC_UNTRUSTED_TAGS_WARNING="<strong>Warning:</strong> Selecting <strong>Yes</strong> processes Sourcerer tags in untrusted content.<br><br>[[%1:untrusted content description%]]<br><br>The CSS, JavaScript and PHP settings below still determine which code is allowed."
